<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fireTMS - Kalkulator Oszczędności</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f2f5;font-family:'DM Sans',sans-serif;padding:20px;min-height:100vh}
.btn-opt{padding:10px 18px;border-radius:10px;border:2px solid #dde1e8;background:#fff;color:#3d4a5c;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;min-width:80px;line-height:1.3}
.btn-opt:hover{border-color:#e8531e;color:#e8531e}
.btn-opt.sel{border-color:#e8531e;background:#fef0eb;color:#e8531e;font-weight:700}
.btn-nav{padding:14px 24px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-next{border:none;background:#e8531e;color:#fff;box-shadow:0 4px 14px rgba(232,83,30,0.3)}
.btn-next:hover{background:#d4460f}
.btn-prev{border:2px solid #dde1e8;background:#fff;color:#3d4a5c}
input[type=number]{padding:10px 14px;border-radius:10px;border:2px solid #dde1e8;font-size:15px;width:130px;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.15s}
input[type=number]:focus{border-color:#e8531e}
.txt-in{padding:10px 14px;border-radius:10px;border:2px solid #dde1e8;font-size:14px;width:100%;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.15s}
.txt-in:focus{border-color:#e8531e}
textarea{padding:10px 14px;border-radius:10px;border:2px solid #dde1e8;font-size:14px;width:100%;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;line-height:1.5}
textarea:focus{border-color:#e8531e;outline:none}
.q-label{font-weight:600;font-size:15px;color:#1a2332;margin-bottom:6px;line-height:1.4}
.q-hint{font-size:12px;color:#7a8699;margin-bottom:8px;font-style:italic;line-height:1.4}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.cond{background:#f6f8fb;border-radius:12px;padding:16px 20px;margin-top:-8px;margin-bottom:24px;border-left:3px solid #e8531e}
.info-box{border-radius:12px;padding:14px 18px;margin-bottom:20px;font-size:13px;line-height:1.5}
.gps-wrap{position:relative}
.gps-drop{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:2px solid #e8531e;border-radius:10px;z-index:200;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.gps-item{padding:9px 14px;cursor:pointer;font-size:14px;color:#3d4a5c;border-bottom:1px solid #f0f2f5}
.gps-item:last-child{border-bottom:none}
.gps-item:hover{background:#fef0eb;color:#e8531e}
.cb-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.cb-row input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#e8531e}
@media print{body{background:#fff;padding:0}.no-print{display:none!important}}
</style>
</head>
<body>
<form name="firetms-stats" netlify netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="firetms-stats"/>
  <input type="hidden" name="bot-field"/>
  <input type="hidden" name="nazwa_firmy"/>
  <input type="hidden" name="typ_firmy"/>
  <input type="hidden" name="liczba_pojazdow"/>
  <input type="hidden" name="spedytorzy"/>
  <input type="hidden" name="ksiegowosc"/>
  <input type="hidden" name="zlecenia_mies"/>
  <input type="hidden" name="pakiet"/>
  <input type="hidden" name="cena_pakietu"/>
  <input type="hidden" name="oszczednosci_zl"/>
  <input type="hidden" name="oszczednosci_godz"/>
  <input type="hidden" name="roi_dni"/>
  <input type="hidden" name="typ_transportu"/>
  <input type="hidden" name="typ_ladunku"/>
  <input type="hidden" name="waluta_faktur"/>
  <input type="hidden" name="ma_gps"/>
  <input type="hidden" name="eurowag"/>
  <input type="hidden" name="wie_rentownosc"/>
  <input type="hidden" name="jednoosobowa"/>
  <input type="hidden" name="ref"/>
  <input type="hidden" name="data"/>
</form>
<div id="root"><div style="text-align:center;padding:60px;color:#7a8699;font-family:sans-serif">Ładowanie kalkulatora...</div></div>
<script type="text/babel">

var useState = React.useState;

// ─── URL REF TRACKING ────────────────────────────────────────────────────────
var URL_REF = (function(){
  try {
    var p = new URLSearchParams(window.location.search);
    return p.get("ref") || p.get("lid") || p.get("src") || "";
  } catch(e){ return ""; }
})();

// ─── TRYB TESTOWY (?test=1 w URL) ────────────────────────────────────────────
var TEST_MODE = (function(){
  try { return new URLSearchParams(window.location.search).get("test") === "1"; }
  catch(e){ return false; }
})();

// ─── NETLIFY FORMS — STATYSTYKI ──────────────────────────────────────────────
function sendStats(a, r) {
  try {
    var eurowagList = (a.eurowag_produkty||[]).join(",");
    var body = new URLSearchParams({
      "form-name":        "firetms-stats",
      "nazwa_firmy":      a.nazwa_firmy || "",
      "typ_firmy":        a.typ_firmy || "",
      "liczba_pojazdow":  String(a.liczba_pojazdow || ""),
      "spedytorzy":       String(a.liczba_spedytorow || ""),
      "ksiegowosc":       String(a.liczba_ksiegowosc || ""),
      "zlecenia_mies":    String(a.zlecenia_mies || ""),
      "pakiet":           r.minPakiet || "",
      "cena_pakietu":     String(r.totalCena || ""),
      "oszczednosci_zl":  String(Math.round(r.totZl) || ""),
      "oszczednosci_godz":String(Math.round(r.totGodz*10)/10 || ""),
      "roi_dni":          String(r.roiDni || ""),
      "typ_transportu":   a.typ_transportu || "",
      "typ_ladunku":      a.typ_ladunku || "",
      "waluta_faktur":    a.waluta_faktur || "",
      "ma_gps":           a.ma_gps || (eurowagList.indexOf("gbox")>=0?"tak":"nie"),
      "eurowag":          eurowagList || "brak",
      "wie_rentownosc":   a.wie_rentownosc || "",
      "jednoosobowa":     r.isJednoosobowa ? "tak" : "nie",
      "ref":              URL_REF || "",
      "data":             new Date().toISOString().slice(0,10)
    });
    fetch("/", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: body.toString()
    }).catch(function(){});
  } catch(e) {}
}

// ─── STALE ────────────────────────────────────────────────────────────────────

var STEPS = [
  {id:"firma",      label:"O firmie"},
  {id:"zlecenia",   label:"Zlecenia"},
  {id:"kierowcy",   label:"Kierowcy i flota"},
  {id:"ksiegowosc", label:"Księgowość"},
  {id:"klient",     label:"Obsługa klienta"},
  {id:"spedycja",   label:"Spedycja i przewoźnicy"},
  {id:"otwarte",    label:"Podsumowanie"},
];

var SPED_H        = 58.21;
var KS_H          = 54.71;
var WLASCICIEL_H  = (58.21+54.71)/2; // ~56.46 zł/h — firma 1-osobowa
var DNI     = 21;
var R_LOW   = 0.70;
var R_HIGH  = 1.38;

var CENNIK = {
  "T":   {Basic:{15:399,30:798,45:1197},   Premium:{15:549,30:1098,45:1647},   Enterprise:{15:649,30:1298,45:1947}},
  "S":   {Basic:{6:399,12:798,18:1197},    Premium:{6:549,12:1098,18:1647},    Enterprise:{6:649,12:1298,18:1947}},
  "TS":  {Basic:{15:549,30:1098,45:1647},  Premium:{15:645,30:1290,45:1935},   Enterprise:{15:859,30:1718,45:2577}},
};

var GPS_LIST = [
  "ABCTrack","Acron","ActiveGPS Server 1","ActiveGPS Server 2","AddSecure","Altsol",
  "ASNET GPS24","ASNET SL","Atrom","AutoGPS","AutoGPS (Atlas)","AutoGuard",
  "BiznesAssist","CargoTrack (ATLAS 1.0)","Cartrack","Commander GPS","CVS",
  "DAF Connect","Data System Group","DBK","Digitrack (Autosoftware)","DKV",
  "EasyTrack","EcoFleet (FleetComplete)","ecoTruck","EMTRACK","EUFleet.com","EuropeTrack",
  "Eurosped GPS","Eurowag (GPS EVA / Gbox)","Finder","FleetHouse","Fleethand",
  "Flota Online","Flota-Online","FlotaPlus","Flotman","Flottaweb",
  "FM Solution","FM Solution (Atlas)","frameLOGIC","Frotcom",
  "Gbox","Geonavi","Geotrak","Global GPS","4GPS",
  "GPS Guardian","GPS LOG","GPS Manager","GPS Online","GPS Poznan","GPS Server","GPS Track","GPSflota",
  "Ikol","Inelo (Tachoscan)","Inelo(GBOX)","INFIS",
  "Juwentus","K2GPS","Keratronik","Konsalnet",
  "Le-Mar GPS System","Leon System","Lincor","Linqo","LocTracker","Locatruck","Logisat","Lokalizoo","Lontex","LupaGPS",
  "MAN (Logiweb)","MAN Digital / RIO","Mercedes (FleetBoard)","MiX Telematics","Monitoring GPS","MultiGPS","MYTRACKO",
  "Navicar","Navifleet","Naviman","Navira","Navisoft","Nawi24","Nawitronik","New Apex",
  "Omnicomm","Other (ATLAS 1.0)","Other (ATLAS 3.0)","Other (rFMS 2.1)",
  "Pointer","ProgressGPS",
  "QS Group",
  "Renault (Optifleet)","Ruptela (CargoTrack)","Ruptela (old)","Ruptela",
  "Safefleet","Samsara","Scania","Scania Fleet Management","Smart Holte","Smartivo",
  "Solid Security","Stoneridge Optac","Strefa GPS","Supervisor",
  "T-CARS","TachoBus","Tekom","Telematika GPS","Teltonika (FMB)","Trace Road",
  "TrackGPS - AROBS","TrackTwo","Tracknamic","Trakero","Trakery","TRAKO",
  "Transics","Transics / ZF","TransMobil","Trimble","Tronik","Tronik (Atlas)","Tronik (Atrax)",
  "Vector","Verizon Connect","Viasat","Viasat (Atlas)","VisiRun","VisiRun (Atlas)","Volvo","Volvo Connect",
  "Web-Sat","Webdispecink","Webfleet","Webfleet (TomTom)","Wialon","Wialon / Gurtam",
  "Widziszwszystko.pl","YellowFox","Zlokalizujmnie.pl",
  "Nie ma na liście - zorganizujemy integrację",
  "Własne rozwiązanie","Nie mamy GPS",
];

function gK(p)  { return p<=15?15:p<=30?30:45; }
function gKS(u) { return u<=6?6:u<=12?12:18; }
function fmt(n) { return Math.round(n).toLocaleString("pl-PL"); }
function fmtH(n){ return n<1 ? Math.round(n*60)+" min" : n.toFixed(1)+" godz"; }
function fmtR(a,b){ return fmt(a)+" - "+fmt(b); }
function fmtHR(a,b){ return fmtH(a)+" - "+fmtH(b); }

// ─── KOMPONENTY UI ────────────────────────────────────────────────────────────

function RG(props) {
  var label=props.label, options=props.options, value=props.value, onChange=props.onChange, hint=props.hint;
  return React.createElement("div", {style:{marginBottom:24}},
    React.createElement("div", {className:"q-label"}, label),
    hint && React.createElement("div", {className:"q-hint"}, hint),
    React.createElement("div", {className:"opts"},
      options.map(function(o) {
        var val = typeof o==="string" ? o : o.value;
        var lab = typeof o==="string" ? o : o.label;
        var sel = value===val;
        return React.createElement("button", {
          key:val,
          className:"btn-opt"+(sel?" sel":""),
          onClick:function(){ onChange(val); }
        }, lab);
      })
    )
  );
}

function NI(props) {
  var label=props.label, onChange=props.onChange, hint=props.hint, suffix=props.suffix, min=props.min, max=props.max;
  var ls = useState(props.value!==undefined ? String(props.value) : "");
  var localVal=ls[0]; var setLocalVal=ls[1];
  return React.createElement("div", {style:{marginBottom:24}},
    React.createElement("div", {className:"q-label"}, label),
    hint && React.createElement("div", {className:"q-hint"}, hint),
    React.createElement("div", {style:{display:"flex",alignItems:"center",gap:8}},
      React.createElement("input", {
        type:"number", value:localVal,
        onChange:function(e){
          setLocalVal(e.target.value);
          if(e.target.value !== "") onChange(Number(e.target.value));
        },
        onBlur:function(e){
          if(e.target.value==="" || Number(e.target.value)<=0){ setLocalVal("0"); onChange(0); }
        },
        min:min||0, max:max
      }),
      suffix && React.createElement("span", {style:{fontSize:14,color:"#7a8699"}}, suffix)
    )
  );
}

function TI(props) {
  var label=props.label, value=props.value, onChange=props.onChange, hint=props.hint, placeholder=props.placeholder, rows=props.rows;
  return React.createElement("div", {style:{marginBottom:24}},
    React.createElement("div", {className:"q-label"}, label),
    hint && React.createElement("div", {className:"q-hint"}, hint),
    React.createElement("textarea", {
      value:value,
      onChange:function(e){ onChange(e.target.value); },
      placeholder:placeholder||"",
      rows:rows||3
    })
  );
}

function GpsSelect(props) {
  var value=props.value, onChange=props.onChange;
  var s = useState(value||"");
  var search = s[0]; var setSearch = s[1];
  var o = useState(false);
  var open = o[0]; var setOpen = o[1];
  var filtered = GPS_LIST.filter(function(g){ return g.toLowerCase().indexOf(search.toLowerCase())>=0; }).slice(0,10);
  return React.createElement("div", {style:{marginBottom:24}},
    React.createElement("div", {className:"q-label"}, "Z jakiego systemu GPS Państwo korzystają?"),
    React.createElement("div", {className:"q-hint"}, "fireTMS posiada 90+ gotowych integracji - prosimy wpisać nazwę lub wybrać z listy"),
    React.createElement("div", {className:"gps-wrap"},
      React.createElement("input", {
        className:"txt-in",
        type:"text",
        value:search,
        placeholder:"Wpisz lub wybierz GPS...",
        onChange:function(e){ setSearch(e.target.value); setOpen(true); onChange(e.target.value); },
        onFocus:function(){ setOpen(true); },
        onBlur:function(){ setTimeout(function(){ setOpen(false); }, 200); }
      }),
      open && filtered.length>0 && React.createElement("div", {className:"gps-drop"},
        filtered.map(function(g){
          return React.createElement("div", {
            key:g,
            className:"gps-item",
            onMouseDown:function(){ setSearch(g); onChange(g); setOpen(false); }
          }, g);
        })
      )
    )
  );
}

function Cond(props) {
  return React.createElement("div", {className:"cond"}, props.children);
}

function InfoBox(props) {
  var color=props.color||"#e8531e";
  var bg=props.bg||"#fef0eb";
  return React.createElement("div", {
    className:"info-box",
    style:{background:bg, border:"1px solid "+color+"44", color:color}
  }, props.children);
}

// ─── KALKULACJA ───────────────────────────────────────────────────────────────

function calcResults(a) {
  var typ   = a.typ_firmy || "TS";
  var isT   = typ==="T" || typ==="TS";
  var isS   = typ==="S" || typ==="TS";
  var isW   = typ==="W";
  var zlec  = a.zlecenia_mies || 100;

  var adhocPct  = a.procent_adhoc || 30;
  var zlecAdhoc = Math.round(zlec * adhocPct / 100);
  var zlecStale = zlec - zlecAdhoc;
  var zlecT     = isT ? zlec : 0;

  var walutaMap = {pln:5, eur:80, mixed:50, other:30};
  var fv        = zlec;
  var fvAdhoc   = zlecAdhoc;
  var fvWalut   = Math.round(fv * (walutaMap[a.waluta_faktur||"eur"]||50) / 100);
  var fvPakiet  = a.wymaga_pdf_pakiet==="tak" ? Math.round(fv*(a.procent_pakiet_pdf||100)/100) : 0;
  var listy     = (a.uzywa_poczty==="tak"||a.uzywa_poczty==="oba") ? (a.listy_pocztowe||0) : 0;

  var minSped = [];
  var minKs   = [];
  var jakosciowe = [];
  var minPakiet  = "Basic";

  // ── SPEDYTOR ──────────────────────────────────────────────────

  // AI zlecenia ad-hoc (Enterprise)
  if (!isW && zlecAdhoc>0) {
    minSped.push({
      nazwa:"Asystent AI - rozczytywanie zleceń ad-hoc",
      min: zlecAdhoc*2,
      pakiet:"Enterprise",
      opis:zlecAdhoc+" zleceń jednorazowych x 2 min"
    });
  }

  // HERE Maps - kalkulator kosztow frachtu (Premium)
  if (!isW && zlecAdhoc>0 && (a.uzywa_here==="tak"||a.uzywa_here==="nie"||a.uzywa_here==="chce")) {
    var hereMin, hereOpisMin;
    if (a.uzywa_here==="tak") {
      hereMin = zlecAdhoc*0.5;
      hereOpisMin = "0.5";
    } else {
      hereMin = zlecAdhoc*2.5;
      hereOpisMin = "2.5";
    }
    minSped.push({
      nazwa: a.uzywa_here==="tak"
        ? "Mapa HERE - kalkulator frachtu wbudowany w zlecenie (zamiast zewnętrznego narzędzia)"
        : "Mapa HERE - kalkulator kosztów trasy dla zleceń jednorazowych/giełdowych",
      min: hereMin,
      pakiet:"Premium",
      opis:zlecAdhoc+" zleceń ad-hoc x "+hereOpisMin+" min"
    });
  }

  // SMS do kierowcy (Enterprise)
  if (isT && a.komunikacja_kierowca!=="aplikacja") {
    minSped.push({
      nazwa:"SMS do kierowcy z szablonem trasy i ładunku",
      min: zlecT*1.5,
      pakiet:"Enterprise",
      opis:zlecT+" zleceń x 1.5 min"
    });
  }

  // GPS checks (Enterprise) - 15 sek/sprawdzenie (przelaczanie miedzy programami), dla chłodni 7 sek
  var isChlodnia = a.typ_ladunku==="chlodn";
  if (isT && (a.ma_gps==="tak" || (a.eurowag_produkty||[]).indexOf("gbox")>=0)) {
    var checks = a.gps_checks_per_day || 10;
    var numSpedGps = a.liczba_spedytorow || 1;
    var secPerCheck = isChlodnia ? 7 : 15;
    var gpsMin = checks * numSpedGps * secPerCheck / 60 * DNI;
    minSped.push({
      nazwa:"Eliminacja ręcznego przełączania między GPS a systemem",
      min: gpsMin,
      pakiet:"Enterprise",
      opis:checks+" sprawdzeń/dzień x "+numSpedGps+" spedyt. x "+secPerCheck+" sek x "+DNI+" dni"+(isChlodnia?" (transport chłodniczy - połowa oszczędności, brak temperatury w fireTMS)":"")
    });
  }

  // Szablony (Basic) - 1 min/zlecenie
  if (zlecStale>0) {
    minSped.push({
      nazwa:"Szablony stałych ładunków (powtarzalne trasy)",
      min: zlecStale*1,
      pakiet:"Basic",
      opis:zlecStale+" stałych zleceń x 1 min"
    });
  }

  // LTL (Premium) - z konkretna iloscia
  if (a.robi_ltl!=="nie" && (a.ltl_count||0)>0) {
    minSped.push({
      nazwa:"Doładunki LTL - łączenie ładunków w systemie",
      min: (a.ltl_count||0)*3,
      pakiet:"Premium",
      opis:(a.ltl_count||0)+" zleceń LTL x 3 min"
    });
  }

  // Przeladunki (Premium) - z konkretna iloscia
  if (a.robi_przeladunki==="tak" && (a.przeladunki_count||0)>0) {
    minSped.push({
      nazwa:"Zlecenia z przeładunkami / przepinkami",
      min: (a.przeladunki_count||0)*3,
      pakiet:"Premium",
      opis:(a.przeladunki_count||0)+" zleceń z przeładunkiem x 3 min"
    });
  }

  // Stawka za km przewoznik (Basic)
  if (isS && a.rozliczenie_przewoznik==="km" && (a.liczba_przewoznikow||0)>0) {
    var kmOrders = Math.round(zlec*0.6);
    minSped.push({
      nazwa:"Auto-przeliczenie frachtu wg stawki za km",
      min: kmOrders*1,
      pakiet:"Basic",
      opis:kmOrders+" zleceń x 1 min (stawka x km z mapy ciężarowej)"
    });
  }

  // Portal przewoznika (Enterprise) - 2 min
  if (isS && (a.liczba_przewoznikow||0)>5) {
    var przew = Math.round(zlec*0.35);
    minSped.push({
      nazwa:"Portal przewoźnika - link do wgrania CMR i FV",
      min: przew*2,
      pakiet:"Enterprise",
      opis:przew+" zleceń x 2 min (przewoźnik sam wrzuca dokumenty)"
    });
  }

  // Panel klienta / Powiadomienia (Enterprise)
  if ((a.pytania_klient||0)>0) {
    var qm = (a.pytania_klient||5)*3*DNI;
    minSped.push({
      nazwa:"Panel klienta / Auto-powiadomienia mailowe o statusie",
      min: qm,
      pakiet:"Enterprise",
      opis:(a.pytania_klient||5)+" zapytań/dzień x 3 min x "+DNI+" dni"
    });
  }

  // ── KSIEGOWA ──────────────────────────────────────────────────

  var fvStali = fv-fvAdhoc;
  if (fvStali>0) {
    minKs.push({nazwa:"Auto-FV - stały klient", min:fvStali*2, pakiet:"Basic", opis:fvStali+" FV x 2 min"});
  }
  if (fvAdhoc>0) {
    minKs.push({nazwa:"Auto-FV - nowy/jednorazowy klient", min:fvAdhoc*5, pakiet:"Basic", opis:fvAdhoc+" FV x 5 min"});
  }
  if (fvPakiet>0) {
    minKs.push({nazwa:"Łączenie FV+CMR+Zlecenie w jeden PDF", min:fvPakiet*2, pakiet:"Basic", opis:fvPakiet+" pakietów x 2 min"});
  }

  var ksMin    = minKs.reduce(function(s,i){ return s+i.min; },0);
  var spedGodz = spedMin/60;
  var ksGodz   = ksMin/60;

  var ksZl     = ksGodz*KS_H;
  var totGodz  = spedGodz+ksGodz;
  var totZl    = spedZl+ksZl;

  var isJednoosobowa = (!(a.liczba_spedytorow>0)) && (!(a.liczba_ksiegowosc>0));
  var pojKey  = gK(a.liczba_pojazdow||15);
  var userKey = gKS(Math.max(1, a.liczba_spedytorow||1));
  var cena = 0;
  if (typ==="T")       cena = (CENNIK["T"][minPakiet]||{})[pojKey]  || 649;
  else if (typ==="S")  cena = (CENNIK["S"][minPakiet]||{})[userKey] || 649;
  else if (typ==="TS") cena = (CENNIK["TS"][minPakiet]||{})[pojKey] || 859;

  var needsHere   = !isW && (a.uzywa_here==="tak" || a.uzywa_here==="chce");

  var totalCena = cena + aiExtraCost + hereMapCost;
  var roiDni = totZl>0 ? Math.round((totalCena/totZl)*30) : 99;

  var wlascicielMin  = spedMin + ksMin;
  var wlascicielGodz = wlascicielMin / 60;
  var wlascicielZl   = wlascicielGodz * WLASCICIEL_H;
